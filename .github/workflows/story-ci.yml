name: Story-first dashboard checks
on:
  push:
    branches: [story-first-forest-ui-nov8]
  pull_request:
    paths:
      - 'app.py'
      - 'story_*.py'
      - 'voice_explorer.py'
      - 'feedback_analyzer.py'
      - 'survey_evidence.py'
      - 'cleaning.py'
      - 'person4/**'
      - 'team_integration.py'
      - 'requirements.txt'
      - 'test_*.py'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q app.py dashboard.py story_theme.py story_pages.py voice_explorer.py feedback_analyzer.py team_integration.py person4/survey_designer.py report_generator.py intervention_planner.py
      - name: Run synthetic integration tests
        run: python -m unittest -v test_story_pages.py test_feedback_integration.py test_team_integration.py test_survey_evolution.py test_voice_explorer.py test_release_audit.py
      - name: Smoke-test all eight Streamlit pages
        run: python -m unittest -v test_app_routes.py
      - name: Run Person 5 regression tests
        run: python test_person5.py
